services:
  wd-monitor:
    build: .
    image: wd-monitor:dev
    container_name: wd-monitor-dev
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - APP_ENV=dev
    volumes:
      # Persistent data (SQLite DB)
      - ./data:/data
      # Local PC files (live reload)
      - ./templates:/app/templates
      - ./static:/app/static
      - ./app.py:/app/app.py
      - ./backend:/app/backend
      - ./catalog.json:/app/catalog.json